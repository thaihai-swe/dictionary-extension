<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/icons/icon-32.png">
  <title>Dictionary & Reading Assistant Preferences</title>
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('dict_setting_theme');
        var theme = raw ? raw.replace(/^"|"$/g, '') : 'dark';
        var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.toggle('dark', isDark);
        root.classList.toggle('light', !isDark);
        root.classList.toggle('light-theme', !isDark);
        root.setAttribute('data-theme', isDark ? 'dark' : 'light');
        root.style.colorScheme = isDark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-paper text-content antialiased font-sans m-0 p-0 selection:bg-accent/20">
  <div id="app" class="w-full min-h-screen"></div>
  <script type="module" src="/src/entrypoints/options/main.tsx"></script>
</body>
</html>
